[pytest]
testpaths = tests
# torch's CPU ops raise a first-chance Windows access-violation exception that
# torch handles internally; it is non-fatal (every test still passes) but
# pytest's faulthandler intercepts the SEH signal and prints a scary C-stack
# dump on Python 3.14 / Windows. Disable it so real failures are readable.
# Verified: the same tests pass identically with faulthandler on or off.
# `slowmodel` is deselected by default: those tests download ~470 MB and take
# ~50 s to load the real multilingual embedding model. Run them deliberately
# after changing the model or the accepted-term lists, since they are the only
# check that it still ranks abstract answers above concrete ones:
#     pytest -m slowmodel
addopts = -p no:faulthandler -m "not slowmodel"
markers =
    slowmodel: needs the real embedding model (large download, slow load)
filterwarnings =
    ignore::DeprecationWarning
